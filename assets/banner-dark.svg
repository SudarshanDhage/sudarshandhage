<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="232" viewBox="0 0 1000 232" role="img" aria-label="Sudarshan Dhage — I design and ship products end to end — interface, service, and everything between.">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.12" />
      <stop offset="55%" stop-color="#a3e635" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0f6fc" stop-opacity="0" />
      <stop offset="50%" stop-color="#f0f6fc" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#f0f6fc" stop-opacity="0" />
    </linearGradient>
    <pattern id="hairlines" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#1e2530" stroke-width="1" opacity="0.55" />
    </pattern>
    <clipPath id="frame">
      <rect x="1" y="1" width="998" height="230" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="232" fill="#0a0c10" />
    <rect width="1000" height="232" fill="url(#hairlines)" />
    <rect width="1000" height="232" fill="url(#wash)" />

    <rect x="-320" y="0" width="320" height="232" fill="url(#sheen)" transform="skewX(-18)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 1460 0" dur="7s" repeatCount="indefinite" additive="sum" />
    </rect>

    <rect x="0" y="0" width="5" height="232" fill="url(#accent)" />
    <line x1="588" y1="42" x2="588" y2="190" stroke="#1e2530" />

    <text x="46" y="58" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2" fill="#7d8590">~/sudarshandhage</text>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.7s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 8; 0 0" dur="0.7s" fill="freeze" />
      <text x="46" y="112" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.2" fill="#f0f6fc">Sudarshan Dhage</text>
    </g>

    <rect x="46" y="126" width="0" height="2" fill="url(#accent)">
      <animate attributeName="width" values="0;462" begin="0.35s" dur="0.8s" fill="freeze" />
    </rect>

    <text x="46" y="152" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="14" fill="#7d8590">software engineer</text>
    <text x="205.6" y="152" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="14" fill="#2b3644">/</text>
    <text x="230.8" y="152" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="14" fill="#7d8590">mobile + backend</text>
    <text x="382" y="152" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="14" fill="#2b3644">/</text>
    <text x="407.2" y="152" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="14" fill="#7d8590">applied AI</text>
    <text x="46" y="188" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#7d8590">I design and ship products end to end — interface, service, and everything</text>
    <text x="46" y="209" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#7d8590">between.</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.5s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="10 0; 0 0" begin="0.5s" dur="0.5s" fill="freeze" />
      <rect x="632" y="75" width="5" height="5" fill="url(#accent)" />
      <text x="648" y="80" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#7d8590">FOCUS</text>
      <text x="648" y="100" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f0f6fc">Flutter · Node.js · Firebase</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="0.64s" dur="0.5s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="10 0; 0 0" begin="0.64s" dur="0.5s" fill="freeze" />
      <rect x="632" y="121" width="5" height="5" fill="url(#accent)" />
      <text x="648" y="126" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#7d8590">MODE</text>
      <text x="648" y="146" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f0f6fc">AI-assisted, review-disciplined</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="0.78s" dur="0.5s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="10 0; 0 0" begin="0.78s" dur="0.5s" fill="freeze" />
      <rect x="632" y="167" width="5" height="5" fill="url(#accent)" />
      <text x="648" y="172" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#7d8590">STATUS</text>
      <text x="648" y="192" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f0f6fc">building something of my own</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="231" rx="14" fill="none" stroke="#1e2530" />
</svg>
