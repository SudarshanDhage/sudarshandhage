<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Sudarshan Dhage — Turning product ideas into software people actually use.">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#232c37" stroke-width="1" opacity="0.35" />
    </pattern>
    <clipPath id="card">
      <rect x="1" y="1" width="998" height="248" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="250" fill="#0d1117" />
    <rect width="1000" height="250" fill="url(#grid)" />
    <circle cx="120" cy="40" r="230" fill="url(#glowA)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 90 40; -30 20; 0 0" dur="18s" repeatCount="indefinite" />
    </circle>
    <circle cx="880" cy="220" r="240" fill="url(#glowB)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -70 -50; 40 -10; 0 0" dur="22s" repeatCount="indefinite" />
    </circle>

    <g transform="translate(838 125)" opacity="0.5">
      <circle r="74" fill="none" stroke="#232c37" stroke-width="1" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite" />
        <circle cx="74" cy="0" r="3.5" fill="url(#accent)" />
      </g>
    </g>
    <g transform="translate(838 125)" opacity="0.75">
      <circle r="54" fill="none" stroke="#232c37" stroke-width="1" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite" />
        <circle cx="54" cy="0" r="3.5" fill="url(#accent)" />
      </g>
    </g>
    <g transform="translate(838 125)" opacity="1">
      <circle r="34" fill="none" stroke="#232c37" stroke-width="1" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite" />
        <circle cx="34" cy="0" r="3.5" fill="url(#accent)" />
      </g>
    </g>
    <circle cx="838" cy="125" r="7" fill="url(#accent)">
      <animate attributeName="r" values="6;9;6" dur="3.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="838" cy="125" r="16" fill="none" stroke="url(#accent)" stroke-width="1">
      <animate attributeName="r" values="12;30;12" dur="3.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.55;0;0.55" dur="3.4s" repeatCount="indefinite" />
    </circle>

    <rect x="48" y="52" width="46" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" values="0;46" dur="0.9s" fill="freeze" />
    </rect>

    <text x="48" y="108" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">Sudarshan Dhage</text>

    <text x="48" y="148" opacity="0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="url(#accent)">Software Engineer<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.23;0.25;1" dur="12s" repeatCount="indefinite" /></text>
    <text x="48" y="148" opacity="0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="url(#accent)">Full-Stack Developer<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.48;0.5;1" dur="12s" repeatCount="indefinite" /></text>
    <text x="48" y="148" opacity="0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="url(#accent)">Flutter &amp; Node.js Engineer<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.73;0.75;1" dur="12s" repeatCount="indefinite" /></text>
    <text x="48" y="148" opacity="0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="url(#accent)">AI-Driven Builder<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.78;0.98;1" dur="12s" repeatCount="indefinite" /></text>
    <rect x="48" y="130" width="2.5" height="23" rx="1.25" fill="url(#accent)">
      <animate attributeName="x" values="241.32;274.29;322.17;232.71" keyTimes="0;0.25;0.5;0.75" calcMode="discrete" dur="12s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;1;0.05;0.05;1" dur="1.1s" repeatCount="indefinite" />
    </rect>

    <text x="48" y="184" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Turning product ideas into software people actually use.</text>
    <text x="48" y="214" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="13" fill="#8b949e" opacity="0.85">@SudarshanDhage</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="249" rx="18" fill="none" stroke="#232c37" />
</svg>
