name: Build profile assets

on:
  push:
    branches: [main]
    paths:
      - 'data/profile.json'
      - 'scripts/**'
      - '.github/workflows/profile-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate SVG assets
        run: npm run build

      - name: Commit regenerated assets
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "Assets already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: regenerate profile assets"
          git push
